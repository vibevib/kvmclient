<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'; frame-src 'none'">
  <title>Sessions</title>
  <style>
    /* Same palette as Settings; Appearance drives prefers-color-scheme. */
    :root {
      --bg: #ffffff; --sunken: #f6f7f8; --line: #dfe3e8;
      --ink: #1b1f23; --ink-2: #57606a; --ink-3: #8b949e;
      --on-ink: #ffffff; --ok: #1a7f37; --warn: #9a6700;
    }
    :root[data-theme="dark"] {
        --bg: #0f0f0f; --sunken: #1b1b1b; --line: #2c2c2c;
        --ink: #e6e6e6; --ink-2: #b0b0b0; --ink-3: #7a7a7a;
        --on-ink: #161616; --ok: #7ee787; --warn: #e0a458;
      }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    #tabs {
      display: flex;
      gap: 6px;
      padding: 8px;
      height: 100%;
      width: 100%;
    }
    /* vertical strip (left/right) */
    body.pos-left #tabs, body.pos-right #tabs {
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }
    /* horizontal strip (top/bottom) */
    body.pos-top #tabs, body.pos-bottom #tabs {
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      align-items: stretch;
    }
    .tab {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--sunken);
      color: var(--ink-2);
      cursor: pointer;
      padding: 8px 4px;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
      overflow: hidden;
    }
    body.pos-left .tab, body.pos-right .tab { width: 100%; min-height: 54px; }
    body.pos-top .tab, body.pos-bottom .tab { height: 100%; min-width: 76px; }
    .tab:hover { border-color: var(--ink-3); }
    .tab .num {
      font-size: 15px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700;
      font-family: 'SF Mono', 'Monaco', monospace;
      line-height: 1;
    }
    .tab .name {
      font-size: 10px;
      color: var(--ink-3);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .tab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--on-ink);
    }
    .tab.active .name { color: var(--on-ink); opacity: 0.75; }
    .tab.idle { opacity: 0.55; border-style: dashed; }
    .tab.suspended { opacity: 0.55; }
    .tab .badge {
      font-size: 9px;
      line-height: 1;
      min-height: 9px;
      color: var(--ok); /* connected */
    }
    .tab.suspended .badge { color: var(--warn); }
    .empty { color: var(--ink-3); font-size: 11px; padding: 10px; text-align: center; }
  </style>
  <script>
    // Stamp the theme before the first paint, so a dark window never flashes
    // white. See broadcastTheme() in main.js for why [data-theme] and not
    // prefers-color-scheme.
    try { document.documentElement.dataset.theme = window.tabbar.theme; } catch (e) {}
  </script>
</head>
<body>
  <div id="tabs"></div>

  <script>
    let state = null;
    const root = document.getElementById('tabs');

    // Escapes quotes too — these results are interpolated into attribute values.
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function render() {
      if (!state) return;
      document.body.className = 'pos-' + (state.position || 'right');
      // Over content → transparent strip (buttons float); own area → solid sidebar
      document.body.style.background = state.overlay ? 'transparent' : '';
      let html = '';
      if (!state.tabs.length) {
        html += '<div class="empty">No tabs</div>';
      }
      state.tabs.forEach(t => {
        const cls = ['tab'];
        if (t.active) cls.push('active');
        else if (t.suspended) cls.push('suspended');
        else if (!t.connected) cls.push('idle');
        const badge = t.suspended ? '❚❚' : (t.connected ? '●' : '');
        // `label` is the tab's short name, or its position when none is set.
        // `title` is the server it points at, kept as the small line + tooltip.
        html += `<button class="${cls.join(' ')}" data-i="${t.index}" title="${escapeHtml(t.title || t.label)}">
          <span class="num">${escapeHtml(t.label)}</span>
          <span class="name">${escapeHtml(t.title || '')}</span>
          <span class="badge">${badge}</span>
        </button>`;
      });
      root.innerHTML = html;
    }

    root.addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (tab) window.tabbar.switchTab(parseInt(tab.dataset.i, 10));
    });

    // Right-click a tab to close it. The menu itself is built in the main
    // process — this page is sandboxed and has no Menu of its own.
    root.addEventListener('contextmenu', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      e.preventDefault();
      window.tabbar.contextMenu(parseInt(tab.dataset.i, 10));
    });

    window.tabbar.onState((s) => { state = s; render(); });
    window.tabbar.getState().then((s) => { state = s; render(); });

    window.tabbar.onTheme((t) => { document.documentElement.dataset.theme = t; });
  </script>
</body>
</html>
