<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'; frame-src 'none'">
  <title>Video Color</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #161616;
      color: #e0e0e0;
      margin: 0;
      padding: 14px 16px;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 { font-size: 14px; font-weight: 600; color: #fff; margin: 0 0 2px 0; letter-spacing: -0.2px; }
    #target { font-size: 11px; color: #777; margin: 0 0 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .section {
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 10px 12px 4px 12px;
      margin-bottom: 12px;
    }
    .section.disabled { opacity: 0.45; pointer-events: none; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .sec-title { font-size: 11px; font-weight: 700; color: #cfcfcf; text-transform: uppercase; letter-spacing: 0.5px; }
    .sec-sub { font-size: 10px; color: #777; }
    .row { display: grid; grid-template-columns: 70px 1fr 56px; align-items: center; gap: 10px; margin-bottom: 8px; }
    .label { font-size: 12px; color: #aaa; white-space: nowrap; }
    .label.r { color: #ff6b6b; font-weight: 600; }
    .label.g { color: #7ee787; font-weight: 600; }
    .label.b { color: #6cb6ff; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: #007aff; cursor: pointer; }
    input[type="number"] {
      width: 100%; padding: 5px 6px; border: none; border-radius: 6px;
      background: #252525; color: #e0e0e0; font-size: 12px;
      font-family: 'SF Mono', 'Monaco', monospace; text-align: right;
    }
    input[type="number"]:focus { outline: none; background: #2d2d2d; box-shadow: 0 0 0 2px rgba(0,122,255,0.35); }
    .hint { font-size: 10px; color: #555; margin: 0 0 12px 0; line-height: 1.4; }
    .buttons { display: flex; flex-direction: column; gap: 8px; }
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 8px 10px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.12s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    button.primary { background: #007aff; color: #fff; }
    button.primary:hover { background: #0066d6; }
    button.secondary { background: #2a2a2a; color: #e0e0e0; }
    button.secondary:hover { background: #333; }
    button:disabled { background: #222; color: #555; cursor: not-allowed; }
    #reset { flex: 0 0 auto; background: none; color: #888; padding: 8px 12px; }
    #reset:hover { color: #ccc; background: #222; }
    #status { height: 14px; font-size: 11px; color: #666; text-align: center; margin-top: 10px; transition: color 0.15s; }
    #status.saved { color: #7ee787; }
  </style>
</head>
<body>
  <h1>Video Adjustments</h1>
  <p id="target">Adjusting…</p>

  <div class="section" id="sec-global">
    <div class="sec-head"><span class="sec-title">Global</span><span class="sec-sub">applies to all servers</span></div>
    <div class="rows" data-scope="global"></div>
  </div>

  <div class="section" id="sec-server">
    <div class="sec-head"><span class="sec-title">This server</span><span class="sec-sub" id="server-sub">only this tab</span></div>
    <div class="rows" data-scope="server"></div>
  </div>

  <p class="hint">Global is the base for every server; the per-server layer stacks on top for the current tab only. 1.000 = no change (Sharpen 0 = off). Arrow keys nudge the boxes.</p>

  <div id="status">Changes save automatically</div>

  <script>
    const PARAMS = [
      { key: 'r', label: 'Red',        cls: 'r', min: 0.5, max: 1.5, step: 0.005, fine: 0.001, dec: 3, neutral: 1 },
      { key: 'g', label: 'Green',      cls: 'g', min: 0.5, max: 1.5, step: 0.005, fine: 0.001, dec: 3, neutral: 1 },
      { key: 'b', label: 'Blue',       cls: 'b', min: 0.5, max: 1.5, step: 0.005, fine: 0.001, dec: 3, neutral: 1 },
      { key: 'brightness', label: 'Brightness', cls: '', min: 0.5, max: 1.5, step: 0.01, fine: 0.01, dec: 2, neutral: 1 },
      { key: 'contrast',   label: 'Contrast',   cls: '', min: 0.5, max: 1.5, step: 0.01, fine: 0.01, dec: 2, neutral: 1 },
      { key: 'saturate',   label: 'Saturation', cls: '', min: 0.0, max: 2.0, step: 0.01, fine: 0.01, dec: 2, neutral: 1 },
      { key: 'sharpen',    label: 'Sharpen',    cls: '', min: 0.0, max: 1.5, step: 0.02, fine: 0.02, dec: 2, neutral: 0 }
    ];
    const BY_KEY = Object.fromEntries(PARAMS.map(p => [p.key, p]));
    const keys = PARAMS.map(p => p.key);
    const state = { global: {}, server: {} };
    let serverId = null, serverName = null;

    // Build the two sections' rows
    ['global', 'server'].forEach(scope => {
      const host = document.querySelector(`.rows[data-scope="${scope}"]`);
      host.innerHTML = PARAMS.map(p => `
        <div class="row">
          <span class="label ${p.cls}">${p.label}</span>
          <input type="range" id="${scope}-${p.key}-range" min="${p.min}" max="${p.max}" step="${p.step}">
          <input type="number" id="${scope}-${p.key}-num" min="${p.min}" max="${p.max}" step="${p.fine}">
        </div>`).join('');
    });

    const el = (scope, key, kind) => document.getElementById(`${scope}-${key}-${kind}`);

    function clamp(p, v) { v = parseFloat(v); if (isNaN(v)) return p.neutral; return Math.min(p.max, Math.max(p.min, v)); }

    let rafId = null;
    function sendPreview() { window.kvmAPI.previewVideoWB({ global: state.global, server: state.server }); }
    function schedulePreview() { if (rafId) return; rafId = requestAnimationFrame(() => { rafId = null; sendPreview(); }); }
    function flushPreview() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } sendPreview(); }

    // Auto-save the layer that changed (no button). Called when a slider is
    // released or a number committed.
    function autosave(scope) {
      if (scope === 'global') window.kvmAPI.saveVideoWB({ params: state.global, scope: 'all' });
      else if (scope === 'server' && serverId) window.kvmAPI.saveVideoWB({ params: state.server, scope: serverId });
      flash('Saved');
    }

    function setParam(scope, key, v, from, immediate) {
      const p = BY_KEY[key];
      v = clamp(p, v);
      state[scope][key] = v;
      if (from !== 'range') el(scope, key, 'range').value = v;
      if (from !== 'num') el(scope, key, 'num').value = v.toFixed(p.dec);
      if (immediate) { flushPreview(); autosave(scope); } else { schedulePreview(); }
    }

    ['global', 'server'].forEach(scope => {
      keys.forEach(key => {
        el(scope, key, 'range').addEventListener('input', e => setParam(scope, key, e.target.value, 'range', false));
        el(scope, key, 'range').addEventListener('change', e => setParam(scope, key, e.target.value, 'range', true));
        el(scope, key, 'num').addEventListener('input', e => setParam(scope, key, e.target.value, 'num', false));
        el(scope, key, 'num').addEventListener('change', e => setParam(scope, key, e.target.value, 'num', true));
      });
    });

    function applyValues(scope, vals) {
      keys.forEach(key => {
        const p = BY_KEY[key];
        const v = vals && vals[key] != null ? vals[key] : p.neutral;
        state[scope][key] = v;
        el(scope, key, 'range').value = v;
        el(scope, key, 'num').value = Number(v).toFixed(p.dec);
      });
    }

    let statusTimer = null;
    function flash(msg) {
      const s = document.getElementById('status');
      s.textContent = msg; s.classList.add('saved');
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { s.classList.remove('saved'); s.textContent = 'Changes save automatically'; }, 1400);
    }

    async function load() {
      const wb = await window.kvmAPI.getVideoWB();
      serverId = wb.serverId;
      serverName = wb.serverName;
      applyValues('global', wb.global);
      applyValues('server', wb.server);

      document.getElementById('target').textContent = serverName ? `Adjusting: ${serverName}` : 'No active video window';
      const secServer = document.getElementById('sec-server');
      document.getElementById('server-sub').textContent = serverName ? `only “${serverName}”` : 'no active session';
      if (serverId) secServer.classList.remove('disabled');
      else secServer.classList.add('disabled');
    }

    // Re-sync to whichever tab is active if it changes while the panel is open
    if (window.kvmAPI.onVideoWBReload) window.kvmAPI.onVideoWBReload(load);

    load();
  </script>
</body>
</html>
